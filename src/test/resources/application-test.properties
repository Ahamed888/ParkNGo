# Isolated SQL Server database. Credentials can be supplied through environment
# variables or local .env.mail.properties (which is gitignored).
spring.config.import=optional:file:./.env.mail.properties,optional:file:./.env.local.properties,optional:file:./.env.properties
spring.datasource.url=${PARKNGO_TEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=parkngo_test;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${PARKNGO_TEST_DB_USERNAME:SA}
spring.datasource.password=${PARKNGO_TEST_DB_PASSWORD:${spring.datasource.password:}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The database itself is dedicated to tests. Create its schema for the test
# context and drop it afterwards so no test records persist.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
parkngo.scheduling.enabled=false
logging.level.root=WARN
parkngo.security.remember-me-key=test-only-remember-me-key
