<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061522">
    <title>Until your next journey - ParkNGo</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/logout-goodbye.css}">
    <script defer th:src="@{/js/logout-goodbye.js}"></script>
</head>
<body>
<main class="outro" id="outro">
    <video class="outro__video" id="outroVideo" autoplay muted playsinline preload="auto" aria-hidden="true">
        <source th:src="@{/images/parkngo-logout.mp4}" type="video/mp4">
    </video>
    <div class="outro__scrim" aria-hidden="true"></div>

    <div class="outro__content" id="outroContent">
        <div class="outro__brand" aria-label="ParkNGo">
            <span th:replace="~{ui/brand :: mark('outro__mark')}"></span>
            <span class="outro__wordmark" aria-hidden="true">Park<span>N</span>Go</span>
        </div>
        <h1>Until your next journey.</h1>
        <p>Your session has ended safely.<br>Thanks for parking with us.</p>
        <a class="outro__home" th:href="@{/(logout=true)}">Back to Home <span aria-hidden="true">→</span></a>
    </div>
</main>
</body>
</html>
