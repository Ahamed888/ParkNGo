<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Reset Password')}">
    <title>Reset Password - ParkNGo</title>
</head>
<body class="min-h-screen bg-[#061827] font-sans text-white">
<main class="relative min-h-screen flex items-center justify-center px-6 py-12 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-[#061827] via-[#0b2941] to-[#020e1b]"></div>
    <section class="relative z-10 w-full max-w-md rounded-2xl border border-white/10 bg-[#071b2d]/95 p-7 shadow-2xl shadow-black/30 backdrop-blur-xl" aria-labelledby="reset-password-title">
        <div class="flex items-center gap-3">
            <span th:replace="~{ui/brand :: mark('w-11 h-11 shrink-0')}"></span>
            <span class="text-xl font-bold tracking-tight">Park<span class="parkngo-brand-n">N</span>Go</span>
        </div>

        <div th:if="${!tokenValid}" class="mt-7">
            <h1 id="reset-password-title" class="text-3xl font-bold tracking-tight">Reset link unavailable</h1>
            <div class="mt-5 rounded-xl border border-status-occupied/30 bg-status-occupied/10 p-4 text-sm leading-relaxed text-status-occupied" role="alert">
                This password reset link is invalid or has expired.
            </div>
            <a th:href="@{/forgot-password}" class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-primary py-3 text-sm font-bold text-navy transition-colors hover:bg-primary-hover">
                Request a New Reset Link
            </a>
        </div>

        <div th:if="${tokenValid}" class="mt-7">
            <h1 id="reset-password-title" class="text-3xl font-bold tracking-tight">Choose a new password</h1>
            <p class="mt-2 text-sm leading-relaxed text-slate-400">Use 8–72 characters with uppercase, lowercase, a number, and a special character.</p>

            <div th:if="${error}" class="mt-5 rounded-xl border border-status-occupied/30 bg-status-occupied/10 p-4 text-sm text-status-occupied" role="alert" th:text="${error}">Reset error</div>

            <form method="post" th:action="@{/reset-password}" class="mt-6 space-y-5">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-field">
                    <label for="newPassword" class="mb-2 block text-xs font-semibold text-slate-300">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="8" maxlength="72"
                           autocomplete="new-password"
                           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}"
                           title="Use 8-72 characters with uppercase, lowercase, a number, and a special character."
                           class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
                           th:classappend="${fieldErrors != null and fieldErrors.containsKey('newPassword')} ? ' input-error'">
                    <p th:if="${fieldErrors != null and fieldErrors.containsKey('newPassword')}" class="field-error" th:text="${fieldErrors.get('newPassword')}">Password error</p>
                </div>

                <div class="form-field">
                    <label for="confirmPassword" class="mb-2 block text-xs font-semibold text-slate-300">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="72"
                           autocomplete="new-password" data-match="#newPassword"
                           data-error-match="Passwords do not match. Please re-enter."
                           class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
                           th:classappend="${fieldErrors != null and fieldErrors.containsKey('confirmPassword')} ? ' input-error'">
                    <p th:if="${fieldErrors != null and fieldErrors.containsKey('confirmPassword')}" class="field-error" th:text="${fieldErrors.get('confirmPassword')}">Confirmation error</p>
                </div>

                <button type="submit" data-loading-text="Resetting password..."
                        class="w-full rounded-xl bg-primary py-3 text-sm font-bold text-navy shadow-lg shadow-primary/20 transition-colors hover:bg-primary-hover">
                    Reset Password
                </button>
            </form>

            <a th:href="@{/login}" class="mt-5 block text-center text-xs font-semibold text-primary hover:text-white transition-colors">Back to Login</a>
        </div>
    </section>
</main>
</body>
</html>
