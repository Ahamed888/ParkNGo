<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/head :: head('Live occupancy')}"><title>Live occupancy · ParkNGo</title></head><body class="font-sans min-h-screen"><div th:replace="~{layout/app :: sidebar('STAFF', 'occupancy')}"></div><div class="md:pl-64 min-h-screen"><div th:replace="~{layout/app :: topbar('Live occupancy', 'STAFF')}"></div><main class="pg-page"><div th:replace="~{ui/flash :: flash}"></div><div class="pg-heading"><div><span class="eyebrow">OPERATIONS / PARKING FLOORS</span><h1>See every space.</h1><p>Recorded occupancy, scheduled departures, and the details that matter.</p></div><form method="get"><label class="sr-only" for="mapFacility">Parking complex</label><select id="mapFacility" name="facilityId" class="select" onchange="this.form.submit()"><option th:each="f : ${facilities}" th:value="${f.id}" th:text="${f.name}" th:selected="${facility != null and f.id == facility.id}"></option></select></form></div><div th:if="${facility != null}" th:replace="~{ui/parking-map :: map('/staff/slot-map', ${facility != null ? facility.id : null}, false)}"></div><p th:if="${facility == null}" class="pg-empty">No parking complex is configured yet.</p></main></div></body></html>
