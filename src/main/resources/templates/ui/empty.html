<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <div th:fragment="empty(title, body, ctaHref, ctaLabel)"
         th:replace="~{ui/empty :: state('inbox', ${title}, ${body}, ${ctaLabel}, ${ctaHref})}">
    </div>

    <div th:fragment="state(icon, title, body, ctaLabel, ctaHref)"
         class="py-16 px-4 text-center max-w-md mx-auto flex flex-col items-center justify-center">
        <div class="w-16 h-16 rounded-2xl bg-canvas text-ink-400 border border-line-200 flex items-center justify-center mb-4 shadow-xs">
            <i th:if="${icon != null and #strings.startsWith(icon, 'fa-')}"
               th:class="${'fa-solid ' + icon + ' text-2xl text-ink-500'}"></i>
            <i th:if="${icon != null and !#strings.startsWith(icon, 'fa-')}"
               th:attr="data-lucide=${icon}" class="w-8 h-8 text-ink-500"></i>
            <i th:if="${icon == null}" data-lucide="inbox" class="w-8 h-8 text-ink-500"></i>
        </div>

        <h3 class="text-base font-bold text-ink-900" th:text="${title}">No items found</h3>
        <p class="mt-1 text-sm text-ink-500 leading-relaxed" th:text="${body}">No records.</p>

        <div th:if="${ctaLabel != null and ctaHref != null}" class="mt-6">
            <a th:href="${ctaHref}" class="btn btn-primary btn-sm inline-flex items-center gap-2">
                <span th:text="${ctaLabel}">Get Started</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
        </div>
    </div>

</body>
</html>
