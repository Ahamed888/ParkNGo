<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- MONEY DISPLAY FRAGMENTS (LKR, tabular numbers) -->
    <!-- Usage: th:replace="~{ui/money :: lkr(${res.totalAmount})}" -->
    <span th:fragment="lkr(amount)" class="font-num font-bold tabular-nums">
        <span class="text-xs text-slate-500 font-medium mr-0.5">LKR</span>
        <span th:text="${amount != null ? #numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span>
    </span>

    <!-- RATE DISPLAY FRAGMENT -->
    <!-- Usage: th:replace="~{ui/money :: rate(${space.hourlyRate}, 'hr')}" -->
    <span th:fragment="rate(amount, unit)" class="font-num font-semibold tabular-nums inline-flex items-baseline">
        <span class="text-[11px] text-slate-500 font-medium mr-0.5">LKR</span>
        <span th:text="${amount != null ? #numbers.formatDecimal(amount, 1, 'COMMA', 0, 'POINT') : '0'}">0</span>
        <span class="text-xs text-slate-500 font-normal ml-0.5" th:text="${'/' + (unit != null ? unit : 'hr')}">/hr</span>
    </span>

</body>
</html>
