<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- PAGINATION COMPONENT -->
    <div th:fragment="pager(currentPage, totalPages, baseUrl)" 
         th:if="${totalPages != null and totalPages > 1}"
         class="flex items-center justify-between border-t border-line-200 px-4 py-3 sm:px-6 mt-6">
        
        <div class="flex flex-1 justify-between sm:hidden">
            <a th:if="${currentPage > 0}" 
               th:href="@{${baseUrl}(page=${currentPage - 1})}" 
               class="btn btn-secondary px-3 py-1.5 text-xs">
                Previous
            </a>
            <span th:if="${currentPage == 0}" class="btn btn-secondary opacity-50 cursor-not-allowed px-3 py-1.5 text-xs">
                Previous
            </span>

            <a th:if="${currentPage + 1 < totalPages}" 
               th:href="@{${baseUrl}(page=${currentPage + 1})}" 
               class="btn btn-secondary px-3 py-1.5 text-xs">
                Next
            </a>
            <span th:if="${currentPage + 1 >= totalPages}" class="btn btn-secondary opacity-50 cursor-not-allowed px-3 py-1.5 text-xs">
                Next
            </span>
        </div>

        <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
            <div>
                <p class="text-xs text-slate-500 font-medium">
                    Showing page <span class="font-bold text-slate-900" th:text="${currentPage + 1}">1</span>
                    of <span class="font-bold text-slate-900" th:text="${totalPages}">5</span>
                </p>
            </div>
            
            <nav class="isolate inline-flex -space-x-px rounded-md shadow-xs" aria-label="Pagination">
                <!-- Prev button -->
                <a th:if="${currentPage > 0}" 
                   th:href="@{${baseUrl}(page=${currentPage - 1})}" 
                   class="relative inline-flex items-center rounded-l-md px-2.5 py-1.5 text-slate-500 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 focus:outline-offset-0 text-xs">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </a>

                <!-- Pages loop (simple 1 to totalPages) -->
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i == currentPage}" 
                       href="#" 
                       aria-current="page" 
                       class="relative z-10 inline-flex items-center bg-info-600 px-3 py-1.5 text-xs font-bold text-white focus:z-20 font-num" 
                       th:text="${i + 1}">1</a>
                    
                    <a th:if="${i != currentPage and (i < 3 or i > totalPages - 4 or (i >= currentPage - 1 and i <= currentPage + 1))}" 
                       th:href="@{${baseUrl}(page=${i})}" 
                       class="relative inline-flex items-center px-3 py-1.5 text-xs font-semibold text-slate-700 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 font-num" 
                       th:text="${i + 1}">2</a>
                </span>

                <!-- Next button -->
                <a th:if="${currentPage + 1 < totalPages}" 
                   th:href="@{${baseUrl}(page=${currentPage + 1})}" 
                   class="relative inline-flex items-center rounded-r-md px-2.5 py-1.5 text-slate-500 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 focus:outline-offset-0 text-xs">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </a>
            </nav>
        </div>

    </div>

</body>
</html>
