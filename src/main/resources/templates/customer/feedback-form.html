<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Rate Experience')}">
    <title>Rate Experience — ParkNGo</title>
</head>
<body class="bg-mist text-asphalt min-h-screen flex flex-col font-sans antialiased">
    <div class="flex flex-1 min-h-screen">
        <!-- Unified Master Sidebar -->
        <div th:replace="~{layout/app :: sidebar('CUSTOMER', 'feedback')}"></div>

        <!-- Main Layout -->
        <div class="flex-1 md:pl-64 flex flex-col min-w-0 min-h-screen">
            <div th:replace="~{layout/app :: topbar('', 'CUSTOMER')}"></div>

            <main class="p-6 space-y-6 flex-1 overflow-y-auto">
                <div th:replace="~{ui/flash :: flash}"></div>

                <!-- Page Title Bar -->
                <div class="bg-white p-6 rounded-2xl border border-[#DDE3EA] shadow-1">
                    <a href="/customer/feedback" class="text-xs font-semibold text-info-600 hover:underline mb-2 inline-flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Back to Feedback</span>
                    </a>
                    <h1 class="text-2xl font-bold font-heading text-asphalt" th:text="${mode == 'edit' ? 'Edit Your Review' : 'Rate Your Parking Stay'}">Rate Your Parking Stay</h1>
                    <p class="text-xs text-[#5A6A80] mt-0.5">Your feedback helps us continuously improve facility access, cleanliness, and gate operations.</p>
                </div>

                <!-- Form Card -->
                <div class="bg-white p-6 sm:p-8 rounded-2xl border border-[#DDE3EA] shadow-1">
                    <form th:action="${mode == 'edit' ? '/customer/feedback/edit/' + feedback.id : '/customer/feedback/submit'}" th:object="${feedback}" method="post" class="space-y-6">
                        <input th:if="${mode != 'edit'}" type="hidden" name="reservationId" th:value="${reservationId}">

                        <!-- Rating -->
                        <div class="field">
                            <label for="rating" class="label label-required">Overall Rating</label>
                            <select id="rating" th:field="*{rating}" required class="select">
                                <option value="">Select rating (1 to 5 stars)</option>
                                <option value="5">5 Stars — Outstanding Experience</option>
                                <option value="4">4 Stars — Very Good</option>
                                <option value="3">3 Stars — Average</option>
                                <option value="2">2 Stars — Below Expectations</option>
                                <option value="1">1 Star — Poor Experience</option>
                            </select>
                            <p th:if="${fieldErrors != null and fieldErrors.containsKey('rating')}" class="field-error" th:text="${fieldErrors.get('rating')}"></p>
                        </div>

                        <!-- Comment -->
                        <div class="field">
                            <label for="comment" class="label label-required">Your Review &amp; Comments</label>
                            <textarea id="comment" th:field="*{comment}" rows="5" required minlength="3" maxlength="2000"
                                      title="Enter at least 3 characters for your review."
                                      placeholder="Describe your experience with facility access, cleanliness, bay space, or staff..."
                                      class="input"></textarea>
                            <p th:if="${fieldErrors != null and fieldErrors.containsKey('comment')}" class="field-error" th:text="${fieldErrors.get('comment')}"></p>
                        </div>

                        <div class="pt-4 border-t border-[#EDF1F5] flex items-center justify-end gap-3">
                            <a href="/customer/feedback" class="btn btn-secondary btn-md">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-md gap-2">
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                                <span th:text="${mode == 'edit' ? 'Save changes' : 'Submit feedback'}">Submit feedback</span>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
