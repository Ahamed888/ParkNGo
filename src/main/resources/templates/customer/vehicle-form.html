<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(${mode == 'edit' ? 'Edit Vehicle' : 'Register Vehicle'})}">
    <title th:text="${mode == 'edit' ? 'Edit Vehicle &mdash; ParkNGo' : 'Register Vehicle &mdash; ParkNGo'}">Register Vehicle &mdash; ParkNGo</title>
</head>
<body class="bg-mist text-asphalt min-h-screen flex flex-col font-sans antialiased">
    <div class="flex flex-1 min-h-screen">
        <!-- Unified Master Sidebar -->
        <div th:replace="~{layout/app :: sidebar('CUSTOMER', 'vehicles')}"></div>

        <!-- Main Layout -->
        <div class="flex-1 md:pl-64 flex flex-col min-w-0 min-h-screen">
            <div th:replace="~{layout/app :: topbar('Customer Portal', 'CUSTOMER')}"></div>

            <main class="p-6 space-y-6 flex-1 overflow-y-auto">
                <div th:replace="~{ui/flash :: flash}"></div>

                <!-- Page Title Bar -->
                <div class="bg-white p-6 rounded-2xl border border-line-200 shadow-1">
                    <a href="/customer/vehicles" class="text-xs font-semibold text-caution-700 hover:underline mb-2 inline-flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Back to My Vehicles</span>
                    </a>
                    <div class="flex items-center gap-3">
                        <div th:if="${mode == 'edit'}" class="w-10 h-10 rounded-full bg-primary text-caution-700 flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold font-heading text-asphalt"
                                th:text="${mode == 'edit' ? 'Edit Vehicle Profile' : 'Register New Vehicle'}">Register New Vehicle</h1>
                            <p class="text-xs text-slate-500 mt-0.5">
                                <span th:if="${mode == 'edit'}">Update specifications for vehicle plate <strong class="tnum font-mono text-asphalt" th:text="${vehicle.registrationNumber}">ABC-1234</strong>.</span>
                                <span th:if="${mode != 'edit'}">Add your vehicle profile for 1-click reservations and gate attendant check-in.</span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="bg-white p-6 sm:p-8 rounded-2xl border border-line-200 shadow-1">
                    <form method="post"
                          th:action="${mode == 'edit' ? '/customer/vehicles/edit/' + vehicle.id : '/customer/vehicles/add'}"
                          th:object="${vehicle}"
                          class="space-y-6">

                        <!-- Hidden ID for edit mode -->
                        <input type="hidden" th:if="${mode == 'edit'}" th:field="*{id}" />

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <!-- License Plate Number -->
                            <div class="sm:col-span-2 field">
                                <label for="registrationNumber" class="label label-required">License Plate Number</label>
                                <div class="relative">
                                    <input type="text"
                                           id="registrationNumber"
                                           th:field="*{registrationNumber}"
                                           required
                                           minlength="4" maxlength="15"
                                           pattern="^(?:(?:(WP|CP|SP|NW|NC|EP|SG|VA|UW)[ -]?)?[A-Za-z]{2,3}|[0-9]{1,3})[ -]?[0-9]{4}$"
                                           title="Use a valid Sri Lankan plate, such as WP CA-1234, CAB-5678, or 19-1234."
                                           placeholder="e.g. WP CA-1234, CAB-5678, or 19-1234"
                                           data-uppercase="true" autocomplete="off"
                                           th:classappend="${#fields.hasErrors('registrationNumber')} ? 'input-error'"
                                           class="input font-mono font-bold uppercase tracking-wider text-base">
                                </div>
                                <p class="hint flex items-center gap-1 mt-1.5">
                                    <i class="fa-solid fa-circle-info text-caution-700"></i>
                                    <span>Official Sri Lankan DMT format (Provincial: WP CA-1234, Series: CAB-5678, or Classic: 19-1234).</span>
                                </p>
                                <p th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}" class="field-error"></p>
                            </div>

                            <!-- Vehicle Category / Type -->
                            <div class="field">
                                <label for="vehicleType" class="label label-required">Vehicle Category</label>
                                <select id="vehicleType"
                                        th:field="*{vehicleType}"
                                        required
                                        th:classappend="${#fields.hasErrors('vehicleType')} ? 'input-error'"
                                        class="select">
                                    <option value="SEDAN">Sedan / Standard Car</option>
                                    <option value="SUV">SUV / Crossover</option>
                                    <option value="ELECTRIC">Electric Vehicle (EV)</option>
                                    <option value="TRUCK">Pickup / Truck</option>
                                    <option value="MOTORCYCLE">Motorcycle / Scooter</option>
                                    <option value="VAN">Van / Minivan</option>
                                </select>
                                <p th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}" class="field-error"></p>
                            </div>

                            <!-- Vehicle Color -->
                            <div class="field">
                                <label for="color" class="label">Color <span class="text-slate-500 font-normal">(Optional)</span></label>
                                <input type="text"
                                       id="color"
                                       th:field="*{color}"
                                       maxlength="30"
                                       placeholder="e.g. Silver, Black, White, Red"
                                       th:classappend="${#fields.hasErrors('color')} ? 'input-error'"
                                       class="input">
                                <p th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="field-error"></p>

                                <!-- Quick Color Swatches -->
                                <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                                    <button type="button" onclick="selectColor('Black')" title="Black" class="w-5 h-5 rounded-full bg-asphalt border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('White')" title="White" class="w-5 h-5 rounded-full bg-white border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Silver')" title="Silver" class="w-5 h-5 rounded-full bg-gray-400 border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Gray')" title="Gray" class="w-5 h-5 rounded-full bg-slate-600 border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Blue')" title="Blue" class="w-5 h-5 rounded-full bg-info-600 border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Red')" title="Red" class="w-5 h-5 rounded-full bg-[#C8281C] border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Green')" title="Green" class="w-5 h-5 rounded-full bg-go-600 border border-line-200 hover:scale-110 transition-transform"></button>
                                    <button type="button" onclick="selectColor('Yellow')" title="Yellow" class="w-5 h-5 rounded-full bg-primary-100 border border-line-200 hover:scale-110 transition-transform"></button>
                                </div>
                            </div>

                            <!-- Make / Brand -->
                            <div class="field">
                                <label for="brand" class="label label-required">Make / Brand</label>
                                <input type="text"
                                       id="brand"
                                       th:field="*{brand}"
                                       required minlength="1" maxlength="50"
                                       placeholder="e.g. Toyota, Honda, Tesla, BMW"
                                       th:classappend="${#fields.hasErrors('brand')} ? 'input-error'"
                                       class="input">

                                <!-- Popular Brands Quick Selection -->
                                <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                                    <button type="button" onclick="selectBrand('Toyota')" class="chip">Toyota</button>
                                    <button type="button" onclick="selectBrand('Honda')" class="chip">Honda</button>
                                    <button type="button" onclick="selectBrand('Tesla')" class="chip">Tesla</button>
                                    <button type="button" onclick="selectBrand('BMW')" class="chip">BMW</button>
                                    <button type="button" onclick="selectBrand('Nissan')" class="chip">Nissan</button>
                                    <button type="button" onclick="selectBrand('Hyundai')" class="chip">Hyundai</button>
                                </div>
                                <p th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" class="field-error"></p>
                            </div>

                            <!-- Model -->
                            <div class="field">
                                <label for="model" class="label label-required">Model</label>
                                <input type="text"
                                       id="model"
                                       th:field="*{model}"
                                       required minlength="1" maxlength="50"
                                       placeholder="e.g. Camry, Civic, Model 3, RAV4"
                                       th:classappend="${#fields.hasErrors('model')} ? 'input-error'"
                                       class="input">
                                <p th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="field-error"></p>
                            </div>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="pt-6 border-t border-line-100 flex items-center justify-end gap-3">
                            <a href="/customer/vehicles" class="btn btn-secondary btn-md">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary btn-md gap-2">
                                <i class="fa-solid fa-check text-xs"></i>
                                <span th:text="${mode == 'edit' ? 'Update vehicle details' : 'Save &amp; register vehicle'}">Save &amp; register vehicle</span>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script>
        function selectColor(colorName) {
            const input = document.getElementById('color');
            if (input) {
                input.value = colorName;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        function selectBrand(brandName) {
            const input = document.getElementById('brand');
            if (input) {
                input.value = brandName;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }
    </script>
</body>
</html>
