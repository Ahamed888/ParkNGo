# Server Configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=ParkNGo

# Load the private local mail/environment settings when starting from the project directory.
spring.config.import=optional:file:./.env.mail.properties,optional:file:./.env.local.properties,optional:file:./.env.properties

# Gmail SMTP (set MAIL_ENABLED, MAIL_USERNAME, and MAIL_APP_PASSWORD in your environment or .env.mail.properties)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Password reset links (set PASSWORD_RESET_BASE_URL to the public application URL)
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8080}
app.password-reset.token-expiry-minutes=60

# Database Configuration (MSSQL / Microsoft SQL Server)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=parkngo;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:SA}
spring.datasource.password=${DB_PASSWORD:${PARKNGO_DB_PASSWORD:}}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# The project uses versioned, idempotent SQL Server migration scripts rather
# than Flyway. Apply the membership tables before JPA initializes so an
# existing ParkNGo database can render the membership catalogue immediately.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V20261008_03__membership_benefits.sql

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.parkngo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
server.servlet.session.timeout=30m
